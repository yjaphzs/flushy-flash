name: release

# Tag-triggered. You decide when a release happens by pushing a vX.Y.Z tag;
# nothing auto-publishes from a merge.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to rebuild (e.g. v1.0.0)'
        required: true

permissions:
  contents: write # needed to create the Release and upload the APK

jobs:
  android:
    name: Build signed APK and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0 # release notes are generated by diffing against the previous tag

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # RN 0.86's gradle plugin declares jvmToolchain(17). Newer JDKs fail.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Install
        run: npm ci

      - name: Resolve version from tag
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"

      # google-services.json is kept OUT of this public repo. It is not strictly a
      # secret (security comes from rules + App Check), but a published Firebase
      # API key gets scraped and abused for signup spam and quota burn.
      - name: Write Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is not set. See AGENTS.md / README for setup."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > google-services.json
          node -e "JSON.parse(require('fs').readFileSync('google-services.json','utf8'))" \
            || { echo "::error::Decoded google-services.json is not valid JSON."; exit 1; }

      # Google Sign-In's web client id reaches the app as EXPO_PUBLIC_*, which
      # Metro inlines when gradle bundles the JS — so it must be in the
      # environment before assembleRelease, not merely at prebuild.
      #
      # DERIVED from google-services.json rather than carried as its own secret.
      # It is the `client_type: 3` entry of the very file written above, it is
      # not secret (it ships inside the APK either way), and deriving it means
      # the two can never disagree after a new SHA-1 regenerates the config.
      #
      # Without it, env.googleWebClientId is '' and isGoogleSignInConfigured()
      # hides the button. That failure is SILENT — nothing in the build warns —
      # and it is how v1.0.0 shipped with no Google sign-in on the auth screens.
      - name: Derive the Google web client id
        run: |
          ID=$(node -p "(JSON.parse(require('fs').readFileSync('google-services.json','utf8')).client[0].oauth_client.filter(function (o) { return o.client_type === 3; })[0] || {}).client_id || ''")
          if [ -z "$ID" ]; then
            echo "::error::google-services.json has no client_type 3 (web) OAuth client, so Google Sign-In would be hidden in the APK. Enable Google under Authentication, then refresh the GOOGLE_SERVICES_JSON secret with 'npm run firebase:sdkconfig'."
            exit 1
          fi
          echo "EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=$ID" >> "$GITHUB_ENV"
          echo "Google web client id resolved: ${ID%%-*}-<redacted>"

      # expo prebuild reads app.json, so the version has to be set BEFORE it runs.
      # versionCode must increase monotonically or Android refuses the in-place
      # upgrade; run_number gives us that for free and never resets.
      - name: Stamp version into app.json
        run: |
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('app.json','utf8'));
            cfg.expo.version = '${{ steps.version.outputs.name }}';
            cfg.expo.android = cfg.expo.android || {};
            cfg.expo.android.versionCode = ${{ github.run_number }};
            fs.writeFileSync('app.json', JSON.stringify(cfg, null, 2) + '\n');
            console.log('version', cfg.expo.version, 'versionCode', cfg.expo.android.versionCode);
          "

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean
        env:
          # Presence of this var is what switches plugins/with-release-signing.js on.
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set. See README for keystore setup."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/release.keystore"

      - name: Assemble release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # ABIs restricted HERE, on the command line, rather than in app.json.
        #
        # The published v1.0.1 APK was 161 MB, and 125 MB of that was native
        # libraries across four architectures — x86 and x86_64 alone were 69 MB,
        # 45% of what every student downloads, and only an emulator can use them.
        #
        # @react-native/gradle-plugin turns reactNativeArchitectures into
        # defaultConfig.ndk.abiFilters whenever splits.abi is not enabled
        # (NdkConfiguratorUtils.kt:59-62), so this is the whole change.
        #
        # NOT expo-build-properties' buildArchs: that writes gradle.properties,
        # which would also narrow every developer's debug build and
        # native-check.yml's assembleDebug. The release is the only build that
        # should be narrow.
        #
        # armeabi-v7a stays. minSdk is 24, and a 32-bit Android 7 phone is
        # exactly the budget device a CLSU student is most likely to own;
        # dropping it makes the app un-installable for them with no diagnostic.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      # A debug-signed APK would mean students cannot upgrade in place later, and
      # CI would otherwise report that as a success. Fail loudly instead.
      - name: Verify the APK is not debug-signed
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "apk=$APK"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          SIGNER=$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | grep -i 'Subject' | head -1)
          echo "signer: $SIGNER"
          if echo "$SIGNER" | grep -qi 'CN=Android Debug'; then
            echo "::error::APK is debug-signed — the release signing config did not apply."
            exit 1
          fi

      - name: Rename APK
        id: apk
        run: |
          SRC=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          DEST="flushy-flash-${{ steps.version.outputs.tag }}.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "bytes=$(stat -c%s "$DEST")" >> "$GITHUB_OUTPUT"
          # Shipped in the manifest so an integrity check can be added later
          # without a schema bump. The client verifies SIZE today: hashing 50 MB
          # in JS is slow, the transport is TLS, and a tampered APK fails the
          # installer's own signature check against the installed certificate.
          echo "sha256=$(sha256sum "$DEST" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "### APK: $DEST ($(numfmt --to=iec "$(stat -c%s "$DEST")"))" >> "$GITHUB_STEP_SUMMARY"

      # The in-app updater reads THIS, not the GitHub API.
      #
      # api.github.com is 60 requests/hour/IP unauthenticated, and a campus
      # shares one public IP — a few hundred students on a 6h check interval
      # would spend most of the day rate-limited, and a 403 is indistinguishable
      # from "no update" without special handling. Authenticating is impossible:
      # EXPO_PUBLIC_* is inlined and readable inside the APK, so shipping a token
      # would be publishing it.
      #
      # releases/latest/download/<name> is a stable redirect on github.com, which
      # is not rate-limited that way. It also carries the exact byte size, so the
      # UI can say "52 MB" BEFORE starting a download.
      - name: Write the update manifest
        id: manifest
        run: |
          node -e "
            const fs = require('fs');
            const tag = process.env.TAG;
            const apk = process.env.APK;
            fs.writeFileSync('latest.json', JSON.stringify({
              schema: 1,
              version: tag.replace(/^v/, ''),
              versionCode: Number(process.env.RUN_NUMBER),
              notes: null,
              apk: {
                url: \`https://github.com/\${process.env.REPO}/releases/download/\${tag}/\${apk}\`,
                bytes: Number(process.env.BYTES),
                sha256: process.env.SHA256,
              },
              minSdk: 24,
              abi: 'arm64-v8a,armeabi-v7a',
              // Filled in when expo-updates lands; the client prefers OTA when the
              // runtime matches and falls back to the APK when it does not.
              ota: null,
            }, null, 2) + '\n');
          "
          cat latest.json
        env:
          TAG: ${{ steps.version.outputs.tag }}
          APK: ${{ steps.apk.outputs.path }}
          BYTES: ${{ steps.apk.outputs.bytes }}
          RUN_NUMBER: ${{ github.run_number }}
          REPO: ${{ github.repository }}
          SHA256: ${{ steps.apk.outputs.sha256 }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.path }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Flushy Flash ${{ steps.version.outputs.tag }}
          files: |
            ${{ steps.apk.outputs.path }}
            latest.json
          generate_release_notes: true
          body: |
            ## Install

            Download the APK below and open it on your Android phone. You will need to
            allow installs from unknown sources the first time.

            Requires Android 7.0 (Nougat) or newer.
