version: 2

# ⚠️ A default Dependabot config would actively fight this project.
#
# Versions here deliberately track Expo SDK 57's pins rather than npm latest,
# because expo-modules-core is compiled against the SDK's headers (AGENTS.md §5).
# Left unconstrained, Dependabot would raise PRs bumping React Native, React,
# Reanimated and worklets past those pins — each one failing `npx expo-doctor`
# and, worse, sometimes passing CI while breaking the native build.
#
# SDK-owned packages move only via `npx expo install --fix` during an SDK upgrade.
updates:
  # GitHub Actions: always safe to keep current, and the workflows pin major
  # versions that need periodic bumping.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(ci)'
    labels: [chore, dependencies]

  # App dependencies: only the ones the Expo SDK does not own.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    labels: [chore, dependencies]
    ignore:
      # ── Owned by the Expo SDK: bump only via expo-upgrade ──
      - dependency-name: expo
      - dependency-name: expo-*
      - dependency-name: '@expo/*'
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: react-native
      - dependency-name: react-native-*
      - dependency-name: '@react-native/*'
      - dependency-name: '@types/react'
      - dependency-name: typescript
      - dependency-name: jest
      - dependency-name: jest-expo
      - dependency-name: '@types/jest'
      - dependency-name: eslint-config-expo
      # ── Native modules: a bump means a new native build, not a lockfile edit ──
      #
      # NB: the `react-native-*` glob above does NOT cover a package whose name
      # merely ENDS in react-native. lottie-react-native slipped through exactly
      # that gap and Dependabot raised a 7.5.0 bump against the SDK's ~7.3.8,
      # failing expo-doctor.
      - dependency-name: '@react-native-firebase/*'
      - dependency-name: '@maplibre/maplibre-react-native'
      - dependency-name: '@react-native-google-signin/*'
      - dependency-name: lottie-react-native
      # ── HeroUI and its styling engine move together; upgrade deliberately ──
      - dependency-name: heroui-native
      - dependency-name: uniwind
      - dependency-name: tailwindcss

  # The rules test suite is isolated from the app tree, so it moves freely —
  # with one exception.
  - package-ecosystem: npm
    directory: /rules
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(rules)'
    labels: [chore, dependencies]
    ignore:
      # ts-jest 29 peers on `typescript >=4.3 <7`, so a TypeScript MAJOR bump
      # breaks `npm ci` in this directory outright — npm cannot resolve the tree
      # and the rules suite never runs. Minor and patch updates are still
      # welcome; majors wait for ts-jest to support them.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
